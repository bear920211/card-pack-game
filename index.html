    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background: #f8fafc; }
        .map-container {
            position: relative; width: 100%; height: 600px;
            background: #e2e8f0 no-repeat center/contain;
            border-radius: 2.5rem; border: 8px solid white; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
            overflow: hidden; cursor: crosshair;
            transition: background-image 0.3s ease-in-out;
        }
        #shapes-layer, #pins-layer { position: absolute; inset: 0; pointer-events: none; }
        #shapes-layer { z-index: 10; opacity: 1; } 
        #pins-layer { z-index: 20; }
        .building-shape { position: absolute; background: transparent; transform-origin: center; } 
        .floating-pin { position: absolute; transform: translate(-50%, -50%); cursor: pointer; pointer-events: auto; }
        .pin-dot { width: 18px; height: 18px; border-radius: 50%; border: 2.5px solid white; box-shadow: 0 0 12px rgba(0,0,0,0.3); animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0px rgba(79, 70, 229, 0.4); transform: scale(1); }
            70% { box-shadow: 0 0 0 12px rgba(79, 70, 229, 0); transform: scale(1.1); }
            100% { box-shadow: 0 0 0 0px rgba(79, 70, 229, 0); transform: scale(1.1); }
        }
        .tab-active { background-color: #4f46e5 !important; color: white !important; }
        .tab-lost-active { background-color: #ef4444 !important; color: white !important; }
        .campus-tab-active { background-color: #4f46e5; color: white; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }

    <!-- Detail Modal -->
    <div id="detail-modal" class="fixed inset-0 bg-slate-900/60 hidden flex items-center justify-center z-[400] p-4 backdrop-blur-md">
        <div class="bg-white rounded-[2.5rem] max-w-sm w-full overflow-hidden shadow-2xl flex flex-col max-h-[90vh]">
            <div id="detail-header-color" class="w-full bg-slate-100 flex items-center justify-center relative min-h-[150px]">

                <h2 id="detail-name" class="text-2xl font-black text-slate-800 line-clamp-1">物品名稱</h2>
                <div class="flex justify-between items-center mb-4">
                    <p id="detail-loc" class="text-slate-400 font-bold text-sm truncate"></p>

                    <div class="bg-indigo-50/50 rounded-2xl p-4 border-l-4 border-indigo-500">
                        <p class="text-[9px] text-indigo-400 font-black uppercase mb-1">具體位置</p>

                    <div class="bg-amber-50 rounded-2xl p-4 border-l-4 border-amber-400">

                <div class="flex gap-2">

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, setDoc, getDoc, collection, onSnapshot, deleteDoc, increment, query, orderBy, limit, updateDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDnKRElPR1agzd5Lknzbqrv9kJtiD_bKsY",
            authDomain: "lostandnotfound-6d007.firebaseapp.com",
            projectId: "lostandnotfound-6d007",
            storageBucket: "lostandnotfound-6d007.firebasestorage.app",
            messagingSenderId: "456947474024",
            appId: "1:456947474024:web:18382370a1f9ca5c0765dd"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const LOST_COLL = collection(db, "all_reports_v3");
        const USER_COLL = collection(db, "users_v2");

        const campusSettings = {
            'min-sheng': { bg: 'https://i.ibb.co/DPQm11wf/1.png', docId: 'NTCU-CAMPUS-V2' },
            'ying-cai': { bg: 'https://i.ibb.co/pBg8Wzdm/2.png', docId: 'NTCU-CAMPUS-YINGCAI' }
        };

        let currentTab = 'found', currentCampus = 'min-sheng';
        let buildings = [], reports = [], clickPos = {x:50, y:50};
        let campusUnsubscribe = null;

        function checkHit(px, py, b) {
            if (b.type === 'poly' && b.points) {
                let inside = false;
                for (let i = 0, j = b.points.length - 1; i < b.points.length; j = i++) {
                    const xi = b.points[i].x, yi = b.points[i].y;
                    const xj = b.points[j].x, yj = b.points[j].y;
                    if (((yi > py) != (yj > py)) && (px < (xj - xi) * (py - yi) / (yj - yi) + xi)) inside = !inside;
                }
                return inside;
            }
            if (b.type === 'circle') {
                const rx = b.w / 2, ry = b.h / 2, cx = b.x + rx, cy = b.y + ry;
                return (Math.pow(px - cx, 2) / Math.pow(rx, 2)) + (Math.pow(py - cy, 2) / Math.pow(ry, 2)) <= 1;
            }
            const rad = (b.angle || 0) * Math.PI / 180;
            const cx = b.x + b.w/2, cy = b.y + b.h/2;
            const dx = px - cx, dy = py - cy;
            const rx = dx * Math.cos(-rad) - dy * Math.sin(-rad);
            const ry = dx * Math.sin(-rad) + dy * Math.cos(-rad);
            if (b.name === "環境樓") {
                const x1 = -b.w/2, y1 = -b.h/2, x2 = -b.w/2, y2 = b.h/2, x3 = b.w/2, y3 = b.h/2;
                const getArea = (xa,ya,xb,yb,xc,yc) => Math.abs((xa*(yb-yc)+xb*(yc-ya)+xc*(ya-yb))/2);
                const total = getArea(x1,y1,x2,y2,x3,y3);
                const pArea = getArea(rx,ry,x1,y1,x2,y2) + getArea(rx,ry,x2,y2,x3,y3) + getArea(rx,ry,x3,y3,x1,y1);
                return Math.abs(total - pArea) < 1.0;
            }
            const bw = b.w / 2 + 1.0;
            const bh = b.h / 2 + 1.0;
            return rx >= -bw && rx <= bw && ry >= -bh && ry <= bh;
        }

        function setDefaultDatetime() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            const timeInput = document.getElementById('in-datetime');
            if (timeInput) timeInput.value = now.toISOString().slice(0, 16);
        }

        // ✅ 加入「年份」的時間格式化函式 (YYYY/MM/DD HH:mm)
        function formatTime(timestampOrIso) {
            if (!timestampOrIso) return "時間未知";
            const date = new Date(timestampOrIso);
            if (isNaN(date.getTime())) return "時間未知";
            const year = date.getFullYear();
            const month = (date.getMonth() + 1).toString().padStart(2, '0');
            const day = date.getDate().toString().padStart(2, '0');
            const hours = date.getHours().toString().padStart(2, '0');
            const mins = date.getMinutes().toString().padStart(2, '0');
            return `${year}/${month}/${day} ${hours}:${mins}`;
        }

        let offsetX = 0, offsetY = 0, scale = 1.0; 

        window.switchCampus = (id) => {
            currentCampus = id;
            const config = campusSettings[id];
            const mapRoot = document.getElementById('map-root');
            mapRoot.style.backgroundImage = `url('${config.bg}')`;

            const isYingCai = (id === 'ying-cai');
            mapRoot.style.backgroundSize = isYingCai ? '100% 100%' : 'contain';

            const btnMs = document.getElementById('campus-ms');
            const btnYc = document.getElementById('campus-yc');
            btnMs.className = !isYingCai ? "px-8 py-2 rounded-[1.5rem] font-black text-sm transition-all campus-tab-active" : "px-8 py-2 rounded-[1.5rem] font-black text-sm transition-all text-slate-400 hover:text-indigo-600";
            btnYc.className = isYingCai ? "px-8 py-2 rounded-[1.5rem] font-black text-sm transition-all campus-tab-active" : "px-8 py-2 rounded-[1.5rem] font-black text-sm transition-all text-slate-400 hover:text-indigo-600";

            const refreshShapes = () => {
                const layer = document.getElementById('shapes-layer');
                layer.style.opacity = "1"; 

                layer.innerHTML = buildings.map(b => {
                    const debugStyle = "background: transparent; border: none;";
                    const finalW = b.w * scale;
                    const finalH = b.h * scale;
                    const finalX = b.x * scale + offsetX;
                    const finalY = b.y * scale + offsetY;

                    if (isYingCai && b.type === 'poly' && b.points) {
                        const path = b.points.map(p => `${p.x * scale + offsetX}% ${p.y * scale + offsetY}%`).join(',');
                        return `<div class="building-shape" style="position:absolute; inset:0; clip-path:polygon(${path}); -webkit-clip-path:polygon(${path}); ${debugStyle}"></div>`;
                    } else {
                        return `<div class="building-shape" style="position:absolute; left:${finalX}%; top:${finalY}%; width:${finalW}%; height:${finalH}%; transform:rotate(${b.angle || 0}deg); ${debugStyle}"></div>`;
                    }
                }).join('');
                
                renderPins(); 
            };

            if(campusUnsubscribe) campusUnsubscribe();
            campusUnsubscribe = onSnapshot(doc(db, "campus_data", config.docId), (snap) => {
                if (snap.exists()) {
                    buildings = snap.data().buildings || [];
                    refreshShapes();
                }
            });

            if (isYingCai) {
                window.onkeydown = (e) => {
                    const step = 0.1; 
                    if (e.key === "ArrowUp") offsetY -= step;
                    if (e.key === "ArrowDown") offsetY += step;
                    if (e.key === "ArrowLeft") offsetX -= step;
                    if (e.key === "ArrowRight") offsetX += step;
                    if (e.key.toLowerCase() === "w") scale += 0.01;
                    if (e.key.toLowerCase() === "s") scale -= 0.01;
                    refreshShapes();
                };
            } else {
                window.onkeydown = null;
                offsetX = 0; offsetY = 0; scale = 1.0;
            }

            renderPins();
            renderList();
        };

        document.getElementById('in-nick').addEventListener('change', async (e) => {
            const nick = e.target.value.trim();
            const hint = document.getElementById('nick-hint');
            if(!nick) { hint.innerText = ""; return; }
            hint.innerText = "查詢中...";
            try {
                const userSnap = await getDoc(doc(USER_COLL, nick));
                if(userSnap.exists()) {
                    hint.innerHTML = `✅ 已識別，目前功德：<span class="text-indigo-600 font-black">${userSnap.data().merit || 0}</span>`;
                } else {
                    hint.innerHTML = `✨ <span class="text-emerald-500 font-black">歡迎加入。</span>`;
                }
            } catch(e) { hint.innerText = ""; }
        });

        window.handleMapClick = (e) => {
            const r = document.getElementById('map-root').getBoundingClientRect();
            clickPos = { x:((e.clientX-r.left)/r.width)*100, y:((e.clientY-r.top)/r.height)*100 };
            const hit = buildings.find(b => checkHit(clickPos.x, clickPos.y, b));
            document.getElementById('location-name').innerText = `📍 ${hit ? hit.name : "校園開放區域"}`;
            setDefaultDatetime();
            document.getElementById('report-modal').classList.remove('hidden');
        };

        onSnapshot(LOST_COLL, (s) => {
            reports = s.docs.map(d => ({ id: d.id, ...d.data() }));
            renderPins(); renderList();
        });

        onSnapshot(query(USER_COLL, orderBy("merit", "desc"), limit(5)), (s) => {
            document.getElementById('leaderboard').innerHTML = s.docs.map((d, i) => {
                const isTopThree = i < 3;
                let medalClass = i === 0 ? "bg-amber-400 text-amber-900 shadow-sm" : i === 1 ? "bg-slate-300 text-slate-800" : i === 2 ? "bg-orange-300 text-orange-900" : "";
                return `<div class="flex justify-between items-center p-2.5 bg-white/85 backdrop-blur-md rounded-xl mb-2 border border-white/60 shadow-sm transition-all">
                    <div class="flex items-center gap-3">
                        <div class="w-8 flex justify-center">
                            ${isTopThree ? `<span class="w-7 h-7 flex items-center justify-center rounded-full font-black text-[13px] ${medalClass}">${i + 1}</span>` : `<span class="text-slate-500 font-medium text-[14px] ml-1">${i + 1}.</span>`}
                        </div>
                        <span class="text-slate-800 font-semibold text-[16px]">${d.id}</span>
                    </div>
                    <div class="flex items-center gap-1.5">
                        <span class="font-black text-orange-600 text-[20px]">${d.data().merit || 0}</span>
                        <span class="text-[11px] font-bold text-slate-500">🧱🐟</span>
                    </div>
                </div>`;
            }).join('');
            if(s.docs[0]) document.getElementById('top-hero-name').innerText = s.docs[0].id;
        });

        window.switchTab = (t) => {
            currentTab = t;
            document.getElementById('tab-found').className = t==='found' ? "flex-1 py-2 rounded-xl font-black text-sm tab-active" : "flex-1 py-2 rounded-xl font-black text-sm text-slate-400";
            document.getElementById('tab-lost').className = t==='lost' ? "flex-1 py-2 rounded-xl font-black text-sm tab-lost-active" : "flex-1 py-2 rounded-xl font-black text-sm text-slate-400"; 
            const btn = document.getElementById('submit-btn');
            btn.innerText = t === 'found' ? "確認標註 (+50 功德)" : "發布求助標記";
            btn.className = `w-full py-4 text-white font-black rounded-2xl shadow-lg transition ${t==='found'?'bg-indigo-600':'bg-red-500'}`;
        };

        document.getElementById('submit-btn').onclick = async () => {
            const nick = document.getElementById('in-nick').value.trim();
            const item = document.getElementById('in-item').value.trim();
            if(!nick || !item) return alert("請填寫必填欄位！");
            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "上傳中...";
            try {
                const datetimeVal = document.getElementById('in-datetime').value;
                await setDoc(doc(LOST_COLL), {
                    type: currentTab, name: item, finder: nick, campus: currentCampus,
                    eventTime: datetimeVal ? new Date(datetimeVal).toISOString() : new Date().toISOString(),
                    floor_info: document.getElementById('in-floor').value,
                    description: document.getElementById('in-desc').value,
                    location: document.getElementById('location-name').innerText.replace('📍 ',''),
                    imageUrl: document.getElementById('img-preview').src.startsWith('data:image') ? document.getElementById('img-preview').src : "",
                    x: clickPos.x, y: clickPos.y, time: Date.now()
                });
                if(currentTab === 'found') {
                    await updateDoc(doc(USER_COLL, nick), { merit: increment(50) }).catch(async () => {
                        await setDoc(doc(USER_COLL, nick), { merit: 50 });
                    });
                }
                alert("發布成功！");
                closeModals();
            } catch(e) { alert("失敗！"); btn.disabled = false; }
        };

        window.openDetail = (id) => {
            const item = reports.find(i => i.id === id); if(!item) return;
            const tag = document.getElementById('type-tag'), claimBtn = document.getElementById('btn-claim-now');
            tag.innerText = item.type === 'found' ? '拾獲物' : '協尋中';
            tag.className = `absolute top-4 left-4 px-4 py-1 rounded-full text-[10px] font-black text-white z-10 ${item.type==='found'?'bg-indigo-600':'bg-red-500'}`;
            claimBtn.innerText = item.type === 'found' ? '是我的！' : '找到了！';
            document.getElementById('detail-name').innerText = item.name;
            document.getElementById('detail-loc').innerText = `📍 ${item.location}`;
            document.getElementById('detail-time').innerText = formatTime(item.eventTime || item.time);
            document.getElementById('detail-floor').innerText = item.floor_info || "尚未提供位置";
            document.getElementById('detail-finder').innerText = item.finder || "匿名英雄";
            document.getElementById('detail-desc').innerText = item.description || "無描述。";
            const img = document.getElementById('detail-img'), ph = document.getElementById('no-img-placeholder');
            if(item.imageUrl) { img.src = item.imageUrl; img.classList.remove('hidden'); ph.classList.add('hidden'); }
            else { img.classList.add('hidden'); ph.classList.remove('hidden'); }
            
            claimBtn.onclick = async () => {
                if(confirm(item.type === 'found' ? '確認要領回這件物品嗎？' : '您是否已經找回這件遺失物？')){
                    if(item.type === 'found' && item.finder) {
                        await updateDoc(doc(USER_COLL, item.finder), { merit: increment(20) }).catch(() => {
                            setDoc(doc(USER_COLL, item.finder), { merit: 20 });
                        });
                        alert(`認領完成！已發放 20 功德給好心人：${item.finder}`);
                    }
                    await deleteDoc(doc(db, "all_reports_v3", id));
                    closeDetail();
                }
            };
            document.getElementById('detail-modal').classList.remove('hidden');
        };

        function renderPins() {
            const layer = document.getElementById('pins-layer'); layer.innerHTML = '';
            const filtered = reports.filter(i => (i.campus || 'min-sheng') === currentCampus);
            filtered.forEach(i => {
                const p = document.createElement('div'); p.className = 'floating-pin';
                p.style.left = `${i.x}%`; p.style.top = `${i.y}%`;
                p.innerHTML = `<div class="pin-dot ${i.type === 'found' ? 'bg-indigo-600' : 'bg-red-500'}"></div>`;
                p.onclick = (e) => { e.stopPropagation(); openDetail(i.id); };
                layer.appendChild(p);
            });
        }

        function renderList() {
            const filtered = reports.filter(i => (i.campus || 'min-sheng') === currentCampus);
            document.getElementById('items-count').innerText = filtered.length;
            document.getElementById('items-list').innerHTML = filtered
                .sort((a,b) => (b.time || 0) - (a.time || 0))
                .map(i => {
                    const timeStr = formatTime(i.eventTime || i.time);
                    return `<div onclick="openDetail('${i.id}')" class="p-3 bg-white rounded-2xl border-l-4 ${i.type==='found'?'border-indigo-500':'border-red-500'} flex items-center gap-3 cursor-pointer shadow-sm hover:shadow-md transition-all">
                        <div class="w-10 h-10 bg-slate-100 rounded-lg flex-shrink-0 flex items-center justify-center overflow-hidden">
                            ${i.imageUrl ? `<img src="${i.imageUrl}" class="w-full h-full object-cover">` : '<span class="text-lg">🎁</span>'}
                        </div>
                        <div class="flex-1 truncate text-left font-bold text-sm text-slate-700">
                            <div class="flex justify-between items-center">
                                <span class="truncate">${i.name}</span>
                                <span class="text-[10px] text-slate-400 font-normal ml-2">${timeStr}</span>
                            </div>
                            <div class="text-[11px] text-slate-400 font-normal truncate">📍 ${i.location}</div>
                        </div>
                    </div>`;
                }).join('');
        }

        window.previewImage = (input) => {
            const f = input.files[0]; if(!f) return;
            const reader = new FileReader(); 
            reader.onload = e => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    let width = img.width, height = img.height, max = 800;
                    if (width > height) { if (width > max) { height *= max / width; width = max; } }
                    else { if (height > max) { width *= max / height; height = max; } }
                    canvas.width = width; canvas.height = height;
                    canvas.getContext('2d').drawImage(img, 0, 0, width, height);
                    document.getElementById('img-preview').src = canvas.toDataURL('image/jpeg', 0.6);
                    document.getElementById('preview-container').classList.remove('hidden');
                    document.getElementById('upload-placeholder').classList.add('hidden');
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(f);
        };

        window.closeModals = () => {
            document.getElementById('report-modal').classList.add('hidden');
            document.getElementById('nick-hint').innerText = "";
            document.getElementById('in-item').value = "";
            document.getElementById('in-floor').value = "";
            document.getElementById('in-desc').value = "";
            document.getElementById('in-file').value = "";
            document.getElementById('img-preview').src = "";
            document.getElementById('preview-container').classList.add('hidden');
            document.getElementById('upload-placeholder').classList.remove('hidden');
            const btn = document.getElementById('submit-btn');
            btn.disabled = false;
            btn.innerText = currentTab === 'found' ? "確認標註 (+50 功德)" : "發布求助標記";
        };
        window.closeDetail = () => document.getElementById('detail-modal').classList.add('hidden');

        window.switchCampus('min-sheng');
    </script>
</body>
</html>
