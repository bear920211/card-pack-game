<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教育部辭典召喚戰役</title>
  <style>
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background-color: #121214; color: #e2e8f0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; box-sizing: border-box; }
    h1 { font-size: 2rem; margin-bottom: 5px; color: #f7fafc; }
    .currency-bar { font-size: 1.1rem; font-weight: bold; color: #ecc94b; margin-bottom: 20px; background-color: rgba(236, 201, 75, 0.1); padding: 6px 20px; border-radius: 40px; border: 1px solid rgba(236, 201, 75, 0.3); }
    .nav-bar { display: flex; gap: 15px; background-color: #1a202c; padding: 8px; border-radius: 40px; margin-bottom: 30px; border: 1px solid #2d3748; }
    .nav-btn { background: transparent; border: none; color: #a0aec0; padding: 10px 24px; font-size: 1rem; font-weight: 600; cursor: pointer; border-radius: 40px; transition: all 0.3s ease; }
    .nav-btn.active, .nav-btn:hover { background-color: #3182ce; color: #ffffff; }
    .screen { display: none; width: 100%; max-width: 800px; }
    .screen.active { display: block; }
    .btn-action { background: linear-gradient(90deg, #3182ce, #319795); border: none; color: white; padding: 12px 35px; font-size: 1rem; font-weight: bold; border-radius: 40px; cursor: pointer; }
    .game-card { width: 220px; height: 320px; background: #2d3748; border-radius: 16px; border: 2px solid #4a5568; display: flex; flex-direction: column; padding: 15px; box-shadow: 0 8px 16px rgba(0,0,0,0.3); }
    .game-card.SSR { border: 3px solid #ecc94b; }
    .card-name { font-weight: bold; font-size: 1.5rem; text-align: center; margin: 10px 0; }
    .card-desc { font-size: 0.75rem; color: #cbd5e0; height: 95px; overflow-y: auto; background: rgba(0,0,0,0.3); padding: 8px; border-radius: 8px; }
    .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
    .loading-text { color: #3182ce; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🎴 教育部辭典召喚戰役</h1>
  <div class="currency-bar">💰 擁有學習點數：<span id="player-gold">1000</span> PTS</div>
  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchScreen('shop-screen')">字詞召喚處</button>
    <button class="nav-btn" onclick="switchScreen('bag-screen')">辭典背包</button>
    <button class="nav-btn" onclick="switchScreen('battle-screen')">論戰競技場</button>
  </div>

  <div id="shop-screen" class="screen active">
    <div style="text-align: center;">
      <button class="btn-action" id="btn-draw" onclick="buyDictionaryPack()">進行終極不重複召喚 (150 PTS)</button>
      <div id="draw-result" style="margin-top:20px;"></div>
    </div>
  </div>

  <div id="bag-screen" class="screen"><div class="inventory-grid" id="inventory-list"></div></div>
  <div id="battle-screen" class="screen"><div id="battle-log" style="color:#fff; font-family:monospace;"></div></div>

  <script>
    const RADICALS = ["電", "機", "車", "貓", "狗", "鳥", "魚", "草", "木", "花", "水", "火", "手", "腳", "心", "口", "頭", "紙", "筆", "書", "球", "燈", "冰", "茶", "飯"];
    const BUILTIN_VOCABULARY = ["電腦", "機器", "火車", "飛貓", "獵狗", "候鳥", "飛魚", "除草", "木頭", "爆花", "熱水", "火山", "手套", "洗腳", "心跳", "借口", "頭髮", "白紙", "鉛筆", "圖書", "籃球", "路燈", "冰塊", "綠茶", "米飯"];
    
    let playerGold = 1000;
    let playerInventory = [];
    let recentWordsHistory = [];

    // --- 核心：無敵不重複隨機演算法 ---
    async function getRandomWordFromDict() {
      const ownedWords = playerInventory.map(card => card.name);
      const absoluteBlacklist = new Set([...recentWordsHistory, ...ownedWords]);

      for(let i=0; i<10; i++) {
        const prefix = RADICALS[Math.floor(Math.random() * RADICALS.length)];
        try {
          const res = await fetch(`https://www.moedict.tw/len/${encodeURIComponent(prefix)}?_t=${Date.now()}`);
          const list = await res.json();
          const filtered = list.filter(w => w.length >= 2 && w.length <= 4 && !absoluteBlacklist.has(w));
          if(filtered.length > 0) {
            const word = filtered[Math.floor(Math.random() * filtered.length)];
            pushToHistory(word);
            return word;
          }
        } catch(e) {}
      }
      
      const localFiltered = BUILTIN_VOCABULARY.filter(w => !absoluteBlacklist.has(w));
      const final = localFiltered.length > 0 ? localFiltered[0] : "奧義代碼" + Math.random();
      pushToHistory(final);
      return final;
    }

    function pushToHistory(word) {
      recentWordsHistory.push(word);
      if (recentWordsHistory.length > 50) recentWordsHistory.shift();
    }

    async function fetchWordData(word) {
      try {
        const res = await fetch(`https://www.moedict.tw/uni/${encodeURIComponent(word)}`);
        const data = await res.json();
        const def = (data.heteronyms && data.heteronyms[0].definitions[0].def) || "無解釋";
        return { name: word, description: def, hp: 100, atk: 50 };
      } catch(e) { return { name: word, description: "神奇之詞", hp: 100, atk: 50 }; }
    }

    async function buyDictionaryPack() {
      if(playerGold < 150) return alert("點數不足");
      playerGold -= 150;
      document.getElementById('player-gold').innerText = playerGold;
      
      const word = await getRandomWordFromDict();
      const card = await fetchWordData(word);
      playerInventory.push(card);
      document.getElementById('draw-result').innerHTML = `<div class="game-card"><div class="card-name">${card.name}</div><div class="card-desc">${card.description}</div></div>`;
    }

    function switchScreen(id) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(id).classList.add('active');
      if(id === 'bag-screen') renderInventory();
    }

    function renderInventory() {
      const list = document.getElementById('inventory-list');
      list.innerHTML = playerInventory.map(c => `<div class="game-card"><div class="card-name">${c.name}</div></div>`).join('');
    }
  </script>
</body>
</html>
