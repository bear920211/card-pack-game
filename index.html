<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡牌召喚戰役 Card Summoner</title>
  <style>
    /* 全域極簡現代暗色調風格 */
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #121214;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 20px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f7fafc;
    }

    /* 導覽列：膠囊形狀按鈕組 */
    .nav-bar {
      display: flex;
      gap: 15px;
      background-color: #1a202c;
      padding: 8px;
      border-radius: 40px; /* 經典 Capsule 圓角 */
      margin-bottom: 30px;
      border: 1px solid #2d3748;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #a0aec0;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 40px; /* 膠囊形狀 */
      transition: all 0.3s ease;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #3182ce;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
    }

    /* 區塊顯示控制 */
    .screen {
      display: none;
      width: 100%;
      max-width: 800px;
      animation: fadeIn 0.4s ease-in-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 1. 抽卡商店區 */
    .shop-container {
      text-align: center;
    }

    .gacha-pack {
      background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
      border: 2px solid #4a5568;
      border-radius: 24px;
      padding: 40px;
      display: inline-block;
      margin-bottom: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    /* 現代圓角按鈕 */
    .btn-action {
      background: linear-gradient(90deg, #3182ce, #319795);
      border: none;
      color: white;
      padding: 14px 40px;
      font-size: 1.1rem;
      font-weight: bold;
      border-radius: 40px; /* 膠囊形狀 */
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(49, 130, 206, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(49, 130, 206, 0.6);
    }

    /* 卡牌容器與動態卡片設計 */
    .card-display-area {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 30px;
      min-height: 220px;
    }

    .game-card {
      width: 140px;
      height: 210px;
      background: #2d3748;
      border-radius: 16px;
      border: 2px solid #4a5568;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }

    .game-card:hover {
      transform: translateY(-5px);
    }

    /* 稀有度顏色標記 */
    .game-card.SSR { border-color: #ecc94b; background: linear-gradient(145deg, #2d3748, #744210); }
    .game-card.SR { border-color: #9f7aea; background: linear-gradient(145deg, #2d3748, #44337a); }
    .game-card.R { border-color: #4299e1; background: linear-gradient(145deg, #2d3748, #2b6cb0); }
    .game-card.N { border-color: #a0aec0; background: #2d3748; }

    .card-rarity {
      font-size: 0.8rem;
      font-weight: 900;
      text-transform: uppercase;
      align-self: flex-start;
      padding: 2px 8px;
      border-radius: 10px;
      background-color: rgba(0,0,0,0.4);
    }

    .SSR .card-rarity { color: #ecc94b; }
    .SR .card-rarity { color: #b7791f; color: #d6bcfa; }
    .R .card-rarity { color: #90cdf4; }
    .N .card-rarity { color: #e2e8f0; }

    .card-name {
      font-weight: bold;
      font-size: 1.1rem;
      margin: 10px 0;
      text-align: center;
    }

    .card-stats {
      font-size: 0.8rem;
      background: rgba(0,0,0,0.3);
      padding: 6px;
      border-radius: 8px;
      text-align: left;
    }

    /* 2. 背包與編隊區 */
    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .deck-info {
      background-color: #1a202c;
      padding: 15px 25px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2d3748;
    }

    /* 3. 戰鬥競技場 */
    .battle-field {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 20px;
      background-color: #1a202c;
      padding: 30px;
      border-radius: 24px;
      border: 1px solid #2d3748;
    }

    .versus {
      font-size: 1.8rem;
      font-weight: bold;
      color: #e53e3e;
      font-style: italic;
    }

    .battle-log-box {
      margin-top: 20px;
      background-color: #0f1219;
      border-radius: 16px;
      padding: 20px;
      height: 200px;
      overflow-y: auto;
      border: 1px solid #2d3748;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .log-entry { margin-bottom: 6px; }
    .log-win { color: #48bb78; font-weight: bold; }
    .log-lose { color: #f56565; font-weight: bold; }
  </style>
</head>
<body>

  <h1>🎴 卡牌召喚戰役</h1>

  <!-- 膠囊導覽列 -->
  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchScreen('shop-screen')">神秘商店</button>
    <button class="nav-btn" onclick="switchScreen('bag-screen')">卡牌背包</button>
    <button class="nav-btn" onclick="switchScreen('battle-screen')">戰鬥競技場</button>
  </div>

  <!-- 1. 商店畫面 -->
  <div id="shop-screen" class="screen active">
    <div class="shop-container">
      <div class="gacha-pack">
        <h3 style="margin-top:0;">傳奇傳承卡包</h3>
        <p style="color: #a0aec0; font-size: 0.9rem; margin-bottom: 25px;">有機會獲得傳說級 SSR 守護獸！</p>
        <button class="btn-action" onclick="drawPack()">點擊開卡包</button>
      </div>
      <div class="card-display-area" id="draw-result">
        <!-- 抽卡結果動態呈現在這裡 -->
      </div>
    </div>
  </div>

  <!-- 2. 背包畫面 -->
  <div id="bag-screen" class="screen">
    <div class="deck-info">
      <div>
        <strong>目前出戰隊友：</strong> 
        <span id="current-fighter-name" style="color: #ecc94b;">無 (請選擇下方卡牌)</span>
      </div>
    </div>
    <div class="inventory-grid" id="inventory-list">
      <!-- 背包卡片列表 -->
    </div>
  </div>

  <!-- 3. 戰鬥畫面 -->
  <div id="battle-screen" class="screen">
    <div style="text-align: center; margin-bottom: 20px;">
      <button class="btn-action" onclick="startCombat()">發動對決！</button>
    </div>
    <div class="battle-field">
      <div id="player-fighter-spot">
        <!-- 玩家戰卡 -->
      </div>
      <div class="versus">VS</div>
      <div id="enemy-fighter-spot">
        <!-- 敵方戰卡 -->
      </div>
    </div>
    <div class="battle-log-box" id="battle-log">
      <div class="log-entry" style="color: #a0aec0;">等待對戰開始...請先在「卡牌背包」中選好出戰卡。</div>
    </div>
  </div>

  <script>
    // --- 遊戲卡片資料庫 ---
    const CARD_POOL = [
      { name: "烈焰巨龍", rarity: "SSR", hp: 150, atk: 45, def: 15, chance: 5 },
      { name: "冰霜領主", rarity: "SR", hp: 110, atk: 35, def: 10, chance: 15 },
      { name: "雷霆迅猛獸", rarity: "SR", hp: 90, atk: 38, def: 8, chance: 20 },
      { name: "森林巨石兵", rarity: "R", hp: 120, atk: 22, def: 20, chance: 30 },
      { name: "哥布林斥候", rarity: "N", hp: 70, atk: 18, def: 5, chance: 30 }
    ];

    // 玩家擁有的卡片
    let playerInventory = [];
    // 當前出戰卡片索引
    let activeCardIndex = null;

    // --- 基礎介面切換 ---
    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(screenId).classList.add('active');
      event.target.classList.add('active');

      if (screenId === 'bag-screen') renderInventory();
      if (screenId === 'battle-screen') prepareBattlefield();
    }

    // --- 抽卡邏輯 ---
    function drawPack() {
      const resultArea = document.getElementById('draw-result');
      resultArea.innerHTML = ''; // 清空舊的

      // 隨機抽一張卡
      let roll = Math.random() * 100;
      let accumulated = 0;
      let pulledCard = CARD_POOL[CARD_POOL.length - 1]; // 預設拿最後一張

      for (let card of CARD_POOL) {
        accumulated += card.chance;
        if (roll <= accumulated) {
          pulledCard = card;
          break;
        }
      }

      // 將抽到的卡加入背包 (使用深拷貝，避免戰鬥改到原始血量)
      const newCard = { ...pulledCard, id: Date.now() };
      playerInventory.push(newCard);

      // 自動將第一張卡設為出戰卡
      if (activeCardIndex === null) activeCardIndex = 0;

      // 建立卡片 DOM 元素並呈現
      const cardEl = createCardElement(newCard);
      resultArea.appendChild(cardEl);
    }

    // 生成卡牌 HTML 結構
    function createCardElement(card, isSelectable = false, index = null) {
      const cardDiv = document.createElement('div');
      cardDiv.className = `game-card ${card.rarity}`;
      if (isSelectable) {
        cardDiv.style.cursor = 'pointer';
        cardDiv.onclick = () => selectFighter(index);
        if (index === activeCardIndex) {
          cardDiv.style.boxShadow = '0 0 15px #ecc94b';
          cardDiv.style.transform = 'scale(1.05)';
        }
      }

      cardDiv.innerHTML = `
        <div class="card-rarity">${card.rarity}</div>
        <div class="card-name">${card.name}</div>
        <div class="card-stats">
          HP: ${card.hp}<br>
          ATK: ${card.atk}<br>
          DEF: ${card.def}
        </div>
      `;
      return cardDiv;
    }

    // --- 背包邏輯 ---
    function renderInventory() {
      const list = document.getElementById('inventory-list');
      list.innerHTML = '';

      if (playerInventory.length === 0) {
        list.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #a0aec0;">目前背包空空的，先去商店抽卡包吧！</p>`;
        return;
      }

      playerInventory.forEach((card, index) => {
        const cardEl = createCardElement(card, true, index);
        list.appendChild(cardEl);
      });

      // 更新頂部出戰卡資訊
      const infoSpan = document.getElementById('current-fighter-name');
      if (activeCardIndex !== null && playerInventory[activeCardIndex]) {
        infoSpan.textContent = `${playerInventory[activeCardIndex].name} (${playerInventory[activeCardIndex].rarity})`;
      } else {
        infoSpan.textContent = "無";
      }
    }

    function selectFighter(index) {
      activeCardIndex = index;
      renderInventory();
    }

    // --- 戰鬥邏輯 ---
    function prepareBattlefield() {
      const pSpot = document.getElementById('player-fighter-spot');
      const eSpot = document.getElementById('enemy-fighter-spot');
      pSpot.innerHTML = '';
      eSpot.innerHTML = '';

      if (activeCardIndex === null || !playerInventory[activeCardIndex]) {
        pSpot.innerHTML = `<div style="color: #718096;">未選擇戰卡</div>`;
        return;
      }

      // 生成玩家對戰卡 (複製一份用來展示，不影響實際血量)
      const pCard = playerInventory[activeCardIndex];
      pSpot.appendChild(createCardElement(pCard));

      // 隨機生成一個對手（從卡池內隨機選一隻）
      const randomOpponent = CARD_POOL[Math.floor(Math.random() * CARD_POOL.length)];
      // 給予對手一個戰鬥專屬暫時變數
      window.currentEnemy = { ...randomOpponent };
      eSpot.appendChild(createCardElement(window.currentEnemy));
    }

    function startCombat() {
      const logBox = document.getElementById('battle-log');
      logBox.innerHTML = ''; // 清空

      if (activeCardIndex === null || !playerInventory[activeCardIndex]) {
        logBox.innerHTML = `<div class="log-entry" style="color: #f56565;">戰鬥失敗：請先去背包選擇出戰卡牌！</div>`;
        return;
      }

      // 取得戰鬥用暫時生命值
      let playerFighter = { ...playerInventory[activeCardIndex] };
      let enemyFighter = { ...window.currentEnemy };

      addLog(`⚔️ 戰鬥開始！${playerFighter.name} VS ${enemyFighter.name}`);

      let round = 1;
      while (playerFighter.hp > 0 && enemyFighter.hp > 0 && round <= 20) {
        addLog(`[回合 ${round}]`);
        
        // 玩家攻擊
        let dmgToEnemy = Math.max(1, playerFighter.atk - enemyFighter.def);
        enemyFighter.hp -= dmgToEnemy;
        addLog(`🗡️ ${playerFighter.name} 發動猛攻，對 ${enemyFighter.name} 造成 ${dmgToEnemy} 點傷害。 (對方 HP: ${Math.max(0, enemyFighter.hp)})`);
        
        if (enemyFighter.hp <= 0) break;

        // 敵人反擊
        let dmgToPlayer = Math.max(1, enemyFighter.atk - playerFighter.def);
        playerFighter.hp -= dmgToPlayer;
        addLog(`💥 ${enemyFighter.name} 展開反擊，對 ${playerFighter.name} 造成 ${dmgToPlayer} 點傷害。 (我方 HP: ${Math.max(0, playerFighter.hp)})`);

        round++;
      }

      // 結算勝負
      if (playerFighter.hp > 0 && enemyFighter.hp <= 0) {
        addLog(`🏆 恭喜！${playerFighter.name} 贏得了這場史詩對決！`, 'log-win');
      } else if (playerFighter.hp <= 0 && enemyFighter.hp > 0) {
        addLog(`💀 殘念！${playerFighter.name} 倒下了，重整旗鼓再來一次吧。`, 'log-lose');
      } else {
        addLog(`⏳ 雙方激戰 20 回合，最終握手言和！`);
      }
    }

    function addLog(text, className = '') {
      const logBox = document.getElementById('battle-log');
      const div = document.createElement('div');
      div.className = `log-entry ${className}`;
      div.innerText = text;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight; // 自動捲動到最底
    }
  </script>
</body>
</html>
