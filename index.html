<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>教育部辭典召喚戰役</title>
  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #121214;
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 5px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #f7fafc;
    }

    .currency-bar {
      font-size: 1.1rem;
      font-weight: bold;
      color: #ecc94b;
      margin-bottom: 20px;
      background-color: rgba(236, 201, 75, 0.1);
      padding: 6px 20px;
      border-radius: 40px; /* Capsule shape preferred */
      border: 1px solid rgba(236, 201, 75, 0.3);
    }

    .nav-bar {
      display: flex;
      gap: 15px;
      background-color: #1a202c;
      padding: 8px;
      border-radius: 40px; /* Capsule shape preferred */
      margin-bottom: 30px;
      border: 1px solid #2d3748;
    }

    .nav-btn {
      background: transparent;
      border: none;
      color: #a0aec0;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      border-radius: 40px; /* Capsule shape preferred */
      transition: all 0.3s ease;
    }

    .nav-btn.active, .nav-btn:hover {
      background-color: #3182ce;
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(49, 130, 206, 0.3);
    }

    .screen {
      display: none;
      width: 100%;
      max-width: 800px;
      animation: fadeIn 0.4s ease-in-out;
    }

    .screen.active {
      display: block;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .shop-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 30px;
    }

    .packs-grid {
      display: flex;
      justify-content: center;
      gap: 25px;
      width: 100%;
    }

    .gacha-pack {
      background: linear-gradient(135deg, #2d3748 0%, #1a202c 100%);
      border: 2px solid #4a5568;
      border-radius: 24px;
      padding: 30px;
      width: 320px;
      box-sizing: border-box;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .pack-price {
      font-size: 1.3rem;
      font-weight: bold;
      color: #ecc94b;
      margin: 15px 0;
    }

    .btn-action {
      background: linear-gradient(90deg, #3182ce, #319795);
      border: none;
      color: white;
      padding: 12px 35px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 40px; /* Capsule shape preferred */
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(49, 130, 206, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
      width: 100%;
    }

    .btn-action:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(49, 130, 206, 0.6);
    }

    .card-display-area {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      min-height: 320px;
      width: 100%;
    }

    /* 質感卡牌 */
    .game-card {
      width: 220px;
      height: 320px;
      background: #2d3748;
      border-radius: 16px;
      border: 2px solid #4a5568;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 15px;
      box-sizing: border-box;
      position: relative;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      transition: transform 0.3s;
    }

    .game-card:hover {
      transform: translateY(-5px);
    }

    /* 稀有度框線效果 */
    .game-card.SSR {
      border: 3px solid #ecc94b;
      box-shadow: 0 0 15px rgba(236, 201, 75, 0.4);
    }

    /* 詞性背景 */
    .game-card.動詞 { background: linear-gradient(145deg, #2d3748, #742a2a); } 
    .game-card.名詞 { background: linear-gradient(145deg, #2d3748, #2b6cb0); } 
    .game-card.形容詞, .game-card.副詞 { background: linear-gradient(145deg, #2d3748, #44337a); } 
    .game-card.其他 { background: linear-gradient(145deg, #2d3748, #2d3748); }

    .card-header-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .card-element {
      font-size: 0.75rem;
      font-weight: 900;
      padding: 2px 8px;
      border-radius: 10px;
      background-color: rgba(0,0,0,0.4);
      color: #fff;
    }

    .card-rarity {
      font-size: 0.75rem;
      font-weight: bold;
      color: #ecc94b;
      background-color: rgba(236, 201, 75, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-name {
      font-weight: bold;
      font-size: 1.5rem;
      margin: 5px 0;
      text-align: center;
      letter-spacing: 1px;
    }

    /* 單字卡特大字體 */
    .game-card.single-char .card-name {
      font-size: 3rem;
      margin: 10px 0;
      color: #fff;
      text-shadow: 0 0 10px rgba(255,255,255,0.3);
    }

    .card-pinyin {
      font-size: 0.8rem;
      color: #cbd5e0;
      text-align: center;
      margin-bottom: 5px;
    }

    .card-desc {
      font-size: 0.75rem;
      color: #cbd5e0;
      height: 95px;
      overflow-y: auto;
      background: rgba(0,0,0,0.3);
      padding: 8px;
      border-radius: 8px;
      margin-bottom: 10px;
      line-height: 1.4;
    }

    .card-stats {
      font-size: 0.8rem;
      background: rgba(0,0,0,0.4);
      padding: 8px;
      border-radius: 8px;
      text-align: left;
      font-family: monospace;
      color: #edf2f7;
    }

    .inventory-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .deck-info {
      background-color: #1a202c;
      padding: 15px 25px;
      border-radius: 20px;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border: 1px solid #2d3748;
    }

    .battle-field {
      display: flex;
      justify-content: space-around;
      align-items: center;
      margin-top: 20px;
      background-color: #1a202c;
      padding: 30px;
      border-radius: 24px;
      border: 1px solid #2d3748;
    }

    .versus {
      font-size: 1.8rem;
      font-weight: bold;
      color: #e53e3e;
      font-style: italic;
    }

    .battle-log-box {
      margin-top: 20px;
      background-color: #0f1219;
      border-radius: 16px;
      padding: 20px;
      height: 220px;
      overflow-y: auto;
      border: 1px solid #2d3748;
      font-family: monospace;
      font-size: 0.9rem;
      line-height: 1.5;
    }

    .log-entry { margin-bottom: 6px; }
    .log-win { color: #48bb78; font-weight: bold; }
    .log-lose { color: #f56565; font-weight: bold; }

    .loading-text {
      color: #3182ce;
      font-weight: bold;
      animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
      from { opacity: 0.5; }
      to { opacity: 1; }
    }
  </style>
</head>
<body>

  <h1>🎴 教育部辭典召喚戰役</h1>
  
  <div class="currency-bar">
    💰 擁有學習點數：<span id="player-gold">1000</span> PTS
  </div>

  <div class="nav-bar">
    <button class="nav-btn active" onclick="switchScreen('shop-screen')">字詞召喚處</button>
    <button class="nav-btn" onclick="switchScreen('bag-screen')">辭典背包</button>
    <button class="nav-btn" onclick="switchScreen('battle-screen')">論戰競技場</button>
  </div>

  <!-- 1. 商店畫面 -->
  <div id="shop-screen" class="screen active">
    <div class="shop-container">
      <div class="packs-grid">
        <div class="gacha-pack">
          <h3 style="margin-top:0; color:#f7fafc;">全漢字部首召喚包</h3>
          <p style="color: #a0aec0; font-size: 0.85rem; margin-bottom: 10px;">
            教育部辭典全字庫隨機檢索！有機率開出極其罕見的<b>單字奧義卡（SSR）</b>、生活詞彙與四字成語。
          </p>
          <div class="pack-price">💰 150 PTS</div>
          <button class="btn-action" id="btn-draw" onclick="buyDictionaryPack()">進行字詞召喚</button>
        </div>
      </div>
      <h3 style="margin-top: 20px; margin-bottom: 5px;">🎉 召喚出的詞彙卡牌</h3>
      <div class="card-display-area" id="draw-result">
        <p style="color: #718096; align-self: center;">尚未召喚，請使用上方卡包</p>
      </div>
    </div>
  </div>

  <!-- 2. 背包畫面 -->
  <div id="bag-screen" class="screen">
    <div class="deck-info">
      <div>
        <strong>目前出戰詞彙：</strong> 
        <span id="current-fighter-name" style="color: #ecc94b;">無 (請選擇下方卡牌)</span>
      </div>
    </div>
    <div class="inventory-grid" id="inventory-list"></div>
  </div>

  <!-- 3. 戰鬥畫面 -->
  <div id="battle-screen" class="screen">
    <div style="text-align: center; margin-bottom: 20px;">
      <button class="btn-action" style="max-width: 200px;" onclick="startCombat()">展開舌戰對決！</button>
    </div>
    <div class="battle-field">
      <div id="player-fighter-spot"></div>
      <div class="versus">VS</div>
      <div id="enemy-fighter-spot"></div>
    </div>
    <div class="battle-log-box" id="battle-log">
      <div class="log-entry" style="color: #a0aec0;">等待對戰開始...請先在「辭典背包」中選好出戰卡。</div>
    </div>
  </div>

  <script>
    // ==================== 終極混合版：成語、字根與生活詞彙字根庫 ====================
    const RADICALS = [
      // 現代/生活字根（容易產出 2~3 字詞，或是單字牌本身）
      "電", "機", "車", "貓", "狗", "鳥", "魚", "草", "木", "花", "水", "火", 
      "手", "腳", "心", "口", "頭", "紙", "筆", "書", "球", "燈", "冰", "茶", "飯",
      // 古典/意象字根（容易產出 4 字成語，或是單字牌本身）
      "風", "雲", "雷", "一", "大", "千", "萬", "金", "山", "海", "空", "死", 
      "開", "天", "地", "神", "鬼", "斬", "鬥", "破", "斷", "狂", "猛", "盾"
    ];

    let playerGold = 1000;
    let playerInventory = [];
    let activeCardIndex = null;

    window.onload = function() {
      updateGoldUI();
    };

    function updateGoldUI() {
      document.getElementById('player-gold').textContent = playerGold;
    }

    // ==================== 真正全自動：隨機在教育部辭典撈取詞彙（1~4字全包） ====================
    async function getRandomWordFromDict() {
      const prefix = RADICALS[Math.floor(Math.random() * RADICALS.length)];
      
      // 🔥 20% 的機率直接把這個「單字」本體當作神級卡牌召喚出來！
      if (Math.random() < 0.20) {
        return prefix; 
      }

      try {
        const searchRes = await fetch(`https://www.moedict.tw/uni/${encodeURIComponent(prefix)}`);
        if (!searchRes.ok) return prefix; // 斷網備用
        
        // 萌典也支持搜尋與該字根相關的詞條
        const listRes = await fetch(`https://www.moedict.tw/a/${encodeURIComponent(prefix)}.json`);
        if (!listRes.ok) return prefix;
        const list = await listRes.json();
        
        if (list && list.length > 0) {
          // 調整長度限制：從 1 到 4 個字通通保留
          const filteredList = list.filter(w => w.length >= 1 && w.length <= 4); 
          
          if (filteredList.length > 0) {
            return filteredList[Math.floor(Math.random() * filteredList.length)];
          }
        }
        return prefix;
      } catch (e) {
        return prefix;
      }
    }

    // ==================== 聯網萌典 API 解析資料 ====================
    async function fetchWordData(word) {
      try {
        const response = await fetch(`https://www.moedict.tw/uni/${encodeURIComponent(word)}`);
        if (!response.ok) throw new Error("API 請求失敗");
        const data = await response.json();

        const pinyin = (data.heteronyms && data.heteronyms[0].pinyin) || "無拼音";
        const bopomofo = (data.heteronyms && data.heteronyms[0].bopomofo) || "無注音";
        
        // 抓取第一個定義
        let definition = "這是一個充滿魔力的辭典字詞。";
        let type = "其他";
        
        if (data.heteronyms && data.heteronyms[0].definitions && data.heteronyms[0].definitions[0]) {
          const defObj = data.heteronyms[0].definitions[0];
          const rawDef = defObj.def || "暫無釋義";
          definition = rawDef.replace(/[\[\]~]/g, ''); 
          
          let rawType = defObj.type || "其他";
          if (rawType.includes("動")) type = "動詞";
          else if (rawType.includes("名")) type = "名詞";
          else if (rawType.includes("形")) type = "形容詞";
          else if (rawType.includes("副")) type = "副詞";
        }

        const wordLength = word.length;
        
        // 稀有度判斷：1字神卡與4字成語為 SSR，其餘為 SR
        let rarity = "SR";
        if (wordLength === 1 || wordLength === 4) {
          rarity = "SSR";
        }

        // 基於字數設計基礎數值（1字走極端路線）
        let hp, atk, def;
        if (wordLength === 1) {
          // 20% 出現肉盾或神力極端卡
          if (Math.random() < 0.5) {
            hp = 80;
            atk = 75; // 極致高傷
            def = 5;
          } else {
            hp = 300; // 極致肉盾
            atk = 10;
            def = 40;
          }
        } else {
          hp = 100 + (wordLength * 20);
          atk = 25 + (wordLength * 5);
          def = 5 + (wordLength * 3);
        }

        // 詞性特色修正
        if (type === "動詞") {
          atk += 18;
          hp -= 15;
        } else if (type === "名詞") {
          def += 12;
          hp += 20;
        } else if (type === "形容詞" || type === "副詞") {
          atk += 8;
          def += 5;
        }

        return {
          id: Date.now() + Math.random(),
          name: word,
          pinyin: `${bopomofo} (${pinyin})`,
          rarity: rarity,
          type: type,
          hp: hp,
          atk: atk,
          def: def,
          description: definition
        };
      } catch (error) {
        console.error("無法取得資料:", error);
        const wl = word.length;
        return {
          id: Date.now(),
          name: word,
          pinyin: "ㄓㄨˋ ㄧㄣ (pinyin)",
          rarity: (wl === 1 || wl === 4) ? "SSR" : "SR",
          type: "其他",
          hp: 120,
          atk: 30,
          def: 10,
          description: "這是一個充滿魔力的神祕詞彙。(因網路原因使用備用資料)"
        };
      }
    }

    // --- 購買與召喚包 ---
    async function buyDictionaryPack() {
      if (playerGold < 150) {
        alert("❌ 學習點數不足！請去「論戰競技場」贏取點數！");
        return;
      }

      const drawButton = document.getElementById('btn-draw');
      const resultArea = document.getElementById('draw-result');
      
      drawButton.disabled = true;
      drawButton.innerText = "深入辭典檢索中...";
      resultArea.innerHTML = `<p class="loading-text">🕵️‍♂️ 正在從教育部整本辭典中隨機翻閱...</p>`;

      playerGold -= 150;
      updateGoldUI();

      // 完全盲抽 1~4 字字詞
      const randomWord = await getRandomWordFromDict();
      const newCard = await fetchWordData(randomWord);

      playerInventory.push(newCard);
      if (activeCardIndex === null) activeCardIndex = 0;

      resultArea.innerHTML = '';
      resultArea.appendChild(createCardElement(newCard));

      drawButton.disabled = false;
      drawButton.innerText = "進行字詞召喚";
    }

    // --- 生成卡片 DOM ---
    function createCardElement(card, isSelectable = false, index = null) {
      const cardDiv = document.createElement('div');
      
      // 若字數為 1，加上特殊 CSS class 讓字體放大
      const isSingle = card.name.length === 1 ? 'single-char' : '';
      cardDiv.className = `game-card ${card.type} ${card.rarity} ${isSingle}`;
      
      if (isSelectable) {
        cardDiv.style.cursor = 'pointer';
        cardDiv.onclick = () => selectFighter(index);
        if (index === activeCardIndex) {
          cardDiv.style.boxShadow = '0 0 15px #ecc94b';
          cardDiv.style.transform = 'scale(1.03)';
        }
      }

      cardDiv.innerHTML = `
        <div class="card-header-row">
          <div class="card-element">${card.type}</div>
          <div class="card-rarity">${card.rarity}</div>
        </div>
        <div class="card-name">${card.name}</div>
        <div class="card-pinyin">${card.pinyin}</div>
        <div class="card-desc">${card.description}</div>
        <div class="card-stats">
          HP : ${card.hp}<br>
          ATK: ${card.atk}<br>
          DEF: ${card.def}
        </div>
      `;
      return cardDiv;
    }

    // --- 介面導覽 ---
    function switchScreen(screenId) {
      document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(screenId).classList.add('active');
      event.target.classList.add('active');

      if (screenId === 'bag-screen') renderInventory();
      if (screenId === 'battle-screen') prepareBattlefield();
    }

    // --- 辭典背包渲染 ---
    function renderInventory() {
      const list = document.getElementById('inventory-list');
      list.innerHTML = '';

      if (playerInventory.length === 0) {
        list.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: #a0aec0;">目前背包空空的，快去字詞召喚處獲取詞牌吧！</p>`;
        return;
      }

      playerInventory.forEach((card, index) => {
        const cardEl = createCardElement(card, true, index);
        list.appendChild(cardEl);
      });

      const infoSpan = document.getElementById('current-fighter-name');
      if (activeCardIndex !== null && playerInventory[activeCardIndex]) {
        infoSpan.textContent = `${playerInventory[activeCardIndex].name} (${playerInventory[activeCardIndex].type})`;
      } else {
        infoSpan.textContent = "無";
      }
    }

    function selectFighter(index) {
      activeCardIndex = index;
      renderInventory();
    }

    // --- 戰場準備 ---
    async function prepareBattlefield() {
      const pSpot = document.getElementById('player-fighter-spot');
      const eSpot = document.getElementById('enemy-fighter-spot');
      pSpot.innerHTML = '';
      eSpot.innerHTML = '';

      if (activeCardIndex === null || !playerInventory[activeCardIndex]) {
        pSpot.innerHTML = `<div style="color: #718096;">未選擇戰卡</div>`;
        return;
      }

      const pCard = playerInventory[activeCardIndex];
      pSpot.appendChild(createCardElement(pCard));

      // 對手也改成完全聯網隨機盲抽 1~4 字
      eSpot.innerHTML = `<span class="loading-text">教育部辭典檢索對手中...</span>`;
      const randomWord = await getRandomWordFromDict();
      window.currentEnemy = await fetchWordData(randomWord);
      
      eSpot.innerHTML = '';
      eSpot.appendChild(createCardElement(window.currentEnemy));
    }

    // ==================== 舌戰對決系統 ====================
    function startCombat() {
      const logBox = document.getElementById('battle-log');
      logBox.innerHTML = ''; 

      if (activeCardIndex === null || !playerInventory[activeCardIndex]) {
        logBox.innerHTML = `<div class="log-entry" style="color: #f56565;">對戰失敗：請先在「辭典背包」中點選出戰詞彙！</div>`;
        return;
      }

      let p = { ...playerInventory[activeCardIndex] };
      let e = { ...window.currentEnemy };

      addLog(`⚔️ 舌戰開始！「${p.name}」 意圖對 「${e.name}」 進行辯論！`);

      // 屬性相剋判定：動詞剋名詞，名詞剋形容詞，形容詞剋動詞
      let pDamageMult = 1.0;
      let eDamageMult = 1.0;

      if (p.type === "動詞" && e.type === "名詞") pDamageMult = 1.5;
      else if (p.type === "名詞" && (e.type === "形容詞" || e.type === "副詞")) pDamageMult = 1.5;
      else if ((p.type === "形容詞" || p.type === "副詞") && e.type === "動詞") pDamageMult = 1.5;

      if (e.type === "動詞" && p.type === "名詞") eDamageMult = 1.5;
      else if (e.type === "名詞" && (p.type === "形容詞" || p.type === "副詞")) eDamageMult = 1.5;
      else if ((e.type === "形容詞" || e.type === "副詞") && p.type === "動詞") eDamageMult = 1.5;

      if (pDamageMult > 1.0) addLog(`💡 詞性剋制！「${p.name}」言詞銳利，直指「${e.name}」的邏輯盲點！(傷害 1.5 倍)`);
      if (eDamageMult > 1.0) addLog(`⚠️ 局勢不妙！「${e.name}」從詞性上完全壓制了我方！(受到傷害 1.5 倍)`);

      let round = 1;
      while (p.hp > 0 && e.hp > 0 && round <= 15) {
        addLog(`[論點交鋒 第 ${round} 回合]`);
        
        // 玩家回合
        let dmgToEnemy = Math.max(1, Math.round((p.atk * pDamageMult) - e.def));
        e.hp -= dmgToEnemy;
        addLog(`🗣️ 「${p.name}」引經據典，對「${e.name}」造成 ${dmgToEnemy} 點邏輯打擊。 (對方辯解值剩下: ${Math.max(0, e.hp)})`);
        
        if (e.hp <= 0) break;

        // 敵人反駁回合
        let dmgToPlayer = Math.max(1, Math.round((e.atk * eDamageMult) - p.def));
        p.hp -= dmgToPlayer;
        addLog(`💥 「${e.name}」針鋒相對，指出「${p.name}」言談漏洞並造成 ${dmgToPlayer} 點破綻。 (我方辯解值剩下: ${Math.max(0, p.hp)})`);

        round++;
      }

      // 獎勵結算
      if (p.hp > 0 && e.hp <= 0) {
        const prize = 250;
        playerGold += prize;
        addLog(`🏆 獲勝！「${p.name}」引經據典、舌燦蓮花，贏得了論戰！`, 'log-win');
        addLog(`💰 榮譽獎勵：獲得學習點數 +${prize} PTS！`, 'log-win');
      } else if (p.hp <= 0 && e.hp > 0) {
        const prize = 50;
        playerGold += prize;
        addLog(`💀 敗北！「${p.name}」一時語塞，遺憾敗下陣來。`, 'log-lose');
        addLog(`🪙 勉勵點數：獲得學習點數 +${prize} PTS！`, 'log-lose');
      } else {
        const prize = 100;
        playerGold += prize;
        addLog(`⏳ 兩造針鋒相對，各執一詞，最終鳴金收兵（平手）！`);
        addLog(`🪙 平分秋色：獲得學習點數 +${prize} PTS！`);
      }

      updateGoldUI();
      prepareBattlefield(); 
    }

    function addLog(text, className = '') {
      const logBox = document.getElementById('battle-log');
      const div = document.createElement('div');
      div.className = `log-entry ${className}`;
      div.innerText = text;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight; 
    }
  </script>
</body>
</html>
